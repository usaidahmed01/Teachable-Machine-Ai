services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: teachable-machine-backend
    ports:
      - "8000:8000"
    volumes:
      - backend_sessions:/app/sessions
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: teachable-machine-frontend
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_sessions: